<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
  <title id="title">Backtracking, dynamic programming, greedy, and optimization patterns</title>
  <desc id="desc">Visual guide for recognizing decision-tree problems, repeated states, greedy proofs, binary search on answers, and bit manipulation.</desc>
  <defs><style>
    .bg{fill:#f8f6fa}.head{fill:#352b48}.ink{fill:#251f31}.muted{fill:#6a6272}.purple{fill:#7652a5}.red{fill:#d65050}.green{fill:#27845e}.gold{fill:#c58d19}.softp{fill:#f2ecf8}.softr{fill:#fff0ef}.softg{fill:#eaf7f0}.softy{fill:#fff7df}.card{fill:#fff;stroke:#ddd6e3;stroke-width:2}.t{font:800 46px Inter,system-ui,sans-serif}.sub{font:500 19px Inter,system-ui,sans-serif}.name{font:800 23px Inter,system-ui,sans-serif}.label{font:800 12px Inter,system-ui,sans-serif;letter-spacing:1.4px}.body{font:600 15px Inter,system-ui,sans-serif}.small{font:550 13px Inter,system-ui,sans-serif}.mono{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.node{fill:#fff;stroke:#7652a5;stroke-width:3}.edge{stroke:#94879f;stroke-width:2.5}.hot{stroke:#d65050;stroke-width:4;fill:none}.cell{fill:#fff;stroke:#baafc2;stroke-width:2}.done{fill:#e2f3ea;stroke:#27845e;stroke-width:2}.white{fill:#fff}
  </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#d65050"/></marker></defs>
  <rect class="bg" width="1600" height="1340"/><rect class="head" width="1600" height="146"/>
  <text class="t white" x="70" y="68">CHOICES: DRAW THE DECISION TREE FIRST</text>
  <text class="sub" x="70" y="108" fill="#d8cee5">Explore every branch with backtracking. Merge repeated states with DP. Use greedy only when you can explain why regret is impossible.</text>

  <!-- recognition equation -->
  <g transform="translate(60 176)"><rect class="card" width="1480" height="120" rx="10"/>
    <text class="label purple" x="22" y="30">THE FORK</text>
    <rect class="softp" x="20" y="48" width="420" height="48" rx="7"/><text class="body ink" x="36" y="78">Need every valid construction?</text><text class="name purple" x="295" y="80">BACKTRACK</text>
    <rect class="softg" x="470" y="48" width="460" height="48" rx="7"/><text class="body ink" x="486" y="78">Need count / best and states repeat?</text><text class="name green" x="790" y="80">DP</text>
    <rect class="softy" x="960" y="48" width="490" height="48" rx="7"/><text class="body ink" x="976" y="78">One local choice can be proven safe?</text><text class="name gold" x="1320" y="80">GREEDY</text>
  </g>

  <!-- row 1 -->
  <g transform="translate(60 322)"><rect class="card" width="720" height="350" rx="10"/><rect class="softp" width="720" height="42" rx="10"/>
    <text class="label purple" x="22" y="27">GENERATE ALL · FIND ANY VALID · CONSTRAINTS CHANGE</text><text class="name ink" x="22" y="77">BACKTRACKING: choose → recurse → undo</text><text class="body muted" x="22" y="104">The path is a partial answer. Prune the moment it cannot become valid.</text>
    <g transform="translate(34 130)"><circle class="node" cx="190" cy="20" r="20"/><circle class="node" cx="105" cy="82" r="20"/><circle class="node" cx="275" cy="82" r="20"/><circle class="node" cx="55" cy="150" r="20"/><circle class="node" cx="155" cy="150" r="20"/><circle class="node" cx="225" cy="150" r="20"/><circle class="node" cx="325" cy="150" r="20"/><line class="edge" x1="174" y1="32" x2="121" y2="70"/><line class="edge" x1="206" y1="32" x2="259" y2="70"/><line class="edge" x1="92" y1="98" x2="68" y2="134"/><line class="edge" x1="118" y1="98" x2="142" y2="134"/><line class="edge" x1="262" y1="98" x2="238" y2="134"/><line class="edge" x1="288" y1="98" x2="312" y2="134"/><path class="hot" d="M190 44C160 65 155 100 155 126" marker-end="url(#arr)"/><path class="hot" d="M153 173C105 194 90 114 105 106" marker-end="url(#arr)"/><text class="small" x="215" y="55" fill="#d65050">choose</text><text class="small" x="82" y="191" fill="#d65050">undo</text></g>
    <g transform="translate(420 132)"><rect class="softr" width="270" height="164" rx="8"/><text class="label red" x="16" y="25">TEMPLATE SHAPE</text><text class="mono ink" x="16" y="52">if complete: record</text><text class="mono ink" x="16" y="78">for choice in choices:</text><text class="mono ink" x="30" y="104">make(choice)</text><text class="mono ink" x="30" y="130">dfs(...)</text><text class="mono ink" x="30" y="156">undo(choice)</text></g>
    <text class="small muted" x="22" y="338">Subsets · Permutations · Combination Sum · N-Queens · Word Search</text>
  </g>
  <g transform="translate(820 322)"><rect class="card" width="720" height="350" rx="10"/><rect class="softg" width="720" height="42" rx="10"/>
    <text class="label green" x="22" y="27">COUNT WAYS · MIN/MAX RESULT · SAME STATE REAPPEARS</text><text class="name ink" x="22" y="77">DYNAMIC PROGRAMMING: cache the future of a state</text><text class="body muted" x="22" y="104">DP is optimized brute force over a decision tree with overlapping states.</text>
    <g transform="translate(32 132)"><rect class="softp" width="305" height="170" rx="8"/><text class="label purple" x="15" y="25">THE 4-LINE DERIVATION</text><text class="body ink" x="15" y="53">1. State: what uniquely defines now?</text><text class="body ink" x="15" y="80">2. Choice: what can I do next?</text><text class="body ink" x="15" y="107">3. Recurrence: combine next states.</text><text class="body ink" x="15" y="134">4. Base: smallest known answer.</text><text class="small muted" x="15" y="157">Then choose memo or table.</text>
    <g transform="translate(345 10)"><rect class="done" width="52" height="52"/><rect class="done" x="54" width="52" height="52"/><rect class="done" x="108" width="52" height="52"/><rect class="cell" x="162" width="52" height="52"/><rect class="cell" y="54" width="52" height="52"/><rect class="done" x="54" y="54" width="52" height="52"/><rect class="done" x="108" y="54" width="52" height="52"/><rect class="cell" x="162" y="54" width="52" height="52"/><rect class="cell" y="108" width="52" height="52"/><rect class="cell" x="54" y="108" width="52" height="52"/><rect class="done" x="108" y="108" width="52" height="52"/><rect class="done" x="162" y="108" width="52" height="52"/><path class="hot" d="M0 172H205" marker-end="url(#arr)"/><text class="small muted" x="0" y="190">fill only after dependencies</text></g></g>
    <text class="small muted" x="22" y="338">House Robber · Coin Change · LCS · Edit Distance · Knapsack</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(60 698)"><rect class="card" width="470" height="305" rx="10"/><rect class="softy" width="470" height="42" rx="10"/>
    <text class="label gold" x="20" y="27">LOCAL BEST · NO BACKTRACKING</text><text class="name ink" x="20" y="76">GREEDY: prove no regret</text><text class="body muted" x="20" y="103">A hunch is not a pattern. State the proof.</text>
    <g transform="translate(24 132)"><rect class="softy" width="422" height="112" rx="8"/><text class="label gold" x="14" y="24">TWO PROOF LENSES</text><text class="body ink" x="14" y="52">Exchange: swap optimal choice with mine; no worse.</text><text class="body ink" x="14" y="79">Stays ahead: after every step, mine is at least as good.</text><text class="small muted" x="14" y="102">Often sort first to expose the safe choice.</text></g>
    <text class="small muted" x="20" y="279">Jump Game · Gas Station · Non-overlap Intervals · Huffman</text>
  </g>
  <g transform="translate(550 698)"><rect class="card" width="470" height="305" rx="10"/><rect class="softr" width="470" height="42" rx="10"/>
    <text class="label red" x="20" y="27">MINIMUM FEASIBLE / MAXIMUM POSSIBLE</text><text class="name ink" x="20" y="76">BINARY SEARCH ON ANSWER</text><text class="body muted" x="20" y="103">You are not searching the input. You search candidates.</text>
    <g transform="translate(24 137)"><text class="mono muted" x="0" y="18">speed:</text><text class="mono ink" x="70" y="18">1  2  3  4  5  6  7  8</text><text class="mono muted" x="70" y="52">F  F  F  F</text><text class="mono red" x="184" y="52">T  T  T  T</text><path class="hot" d="M180 68V98" marker-end="url(#arr)"/><text class="small red" x="180" y="122" text-anchor="middle">first feasible</text><rect class="softp" x="295" y="0" width="125" height="120" rx="8"/><text class="label purple" x="308" y="24">REQUIRES</text><text class="small ink" x="308" y="49">check(x)</text><text class="small ink" x="308" y="71">must be</text><text class="small ink" x="308" y="93">monotonic</text></g>
    <text class="small muted" x="20" y="279">Koko · Ship Packages · Split Array Largest Sum</text>
  </g>
  <g transform="translate(1040 698)"><rect class="card" width="500" height="305" rx="10"/><rect class="softp" width="500" height="42" rx="10"/>
    <text class="label purple" x="20" y="27">SMALL N · SUBSET AS STATE</text><text class="name ink" x="20" y="76">BITMASK: compress yes/no choices</text><text class="body muted" x="20" y="103">One bit answers whether item i is present.</text>
    <g transform="translate(28 135)"><rect class="cell" width="48" height="48"/><rect class="done" x="50" width="48" height="48"/><rect class="cell" x="100" width="48" height="48"/><rect class="done" x="150" width="48" height="48"/><rect class="done" x="200" width="48" height="48"/><text class="body ink" x="24" y="30" text-anchor="middle">0</text><text class="body ink" x="74" y="30" text-anchor="middle">1</text><text class="body ink" x="124" y="30" text-anchor="middle">0</text><text class="body ink" x="174" y="30" text-anchor="middle">1</text><text class="body ink" x="224" y="30" text-anchor="middle">1</text><text class="label purple" x="280" y="21">OPERATIONS</text><text class="mono ink" x="280" y="49">test: mask &amp; (1&lt;&lt;i)</text><text class="mono ink" x="280" y="75">add:  mask | (1&lt;&lt;i)</text><text class="mono ink" x="280" y="101">drop: mask &amp; ~(1&lt;&lt;i)</text><text class="small muted" x="0" y="137">Subsets · State-compression DP · permissions</text></g>
  </g>

  <!-- row 3 -->
  <g transform="translate(60 1029)"><rect class="card" width="470" height="225" rx="10"/><rect class="softp" width="470" height="42" rx="10"/>
    <text class="label purple" x="20" y="27">PAIRS CANCEL · PARITY · SINGLE ODD ITEM</text><text class="name ink" x="20" y="76">XOR / BIT TRICKS</text><text class="mono purple" x="20" y="111">x ^ x = 0    x ^ 0 = x</text><text class="body ink" x="20" y="143">[4, 1, 2, 1, 2] → all pairs vanish → 4</text><text class="small muted" x="20" y="185">Single Number · Missing Number · Counting bits</text><text class="small red" x="20" y="207">Use only when the algebra matches the problem.</text>
  </g>
  <g transform="translate(550 1029)"><rect class="card" width="470" height="225" rx="10"/><rect class="softp" width="470" height="42" rx="10"/>
    <text class="label purple" x="20" y="27">INDEPENDENT HALVES + CHEAP COMBINE</text><text class="name ink" x="20" y="76">DIVIDE &amp; CONQUER</text>
    <g transform="translate(24 100)"><rect class="softp" width="110" height="42" rx="6"/><text class="small ink" x="55" y="27" text-anchor="middle">whole</text><path class="hot" d="M120 21H170" marker-end="url(#arr)"/><rect class="softg" x="180" width="105" height="42" rx="6"/><rect class="softg" x="295" width="105" height="42" rx="6"/><text class="small ink" x="232" y="27" text-anchor="middle">left</text><text class="small ink" x="347" y="27" text-anchor="middle">right</text><text class="small muted" x="0" y="76">Merge Sort · Quickselect · Tree recursion</text></g>
  </g>
  <g transform="translate(1040 1029)"><rect class="card" width="500" height="225" rx="10"/><rect class="softr" width="500" height="42" rx="10"/>
    <text class="label red" x="20" y="27">BACKTRACKING VS DP: THE MEMORY TEST</text><text class="name ink" x="20" y="76">Do two branches reach the same state?</text><text class="body ink" x="20" y="112">No → explore both; path matters → BACKTRACK.</text><text class="body ink" x="20" y="143">Yes → future is identical; cache it → DP.</text><rect class="softy" x="20" y="166" width="460" height="36" rx="6"/><text class="small ink" x="34" y="189">State must contain everything the future answer depends on.</text>
  </g>
  <text class="sub ink" x="800" y="1302" text-anchor="middle">Start with choices. The pattern appears when you ask whether paths must all be produced, repeated states can merge, or one choice is provably safe.</text>
</svg>
