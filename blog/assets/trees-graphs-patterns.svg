<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc">
  <title id="title">Trees, graphs, and grids interview recognition sheet</title>
  <desc id="desc">Visual guide to tree recursion, DFS, BFS, grids, topological sorting, union-find, Dijkstra, and minimum spanning trees.</desc>
  <defs><style>
    .bg{fill:#f5f8f5}.head{fill:#173c2e}.ink{fill:#16271f}.muted{fill:#5a6961}.green{fill:#268b60}.red{fill:#d45545}.gold{fill:#ce941d}.soft{fill:#eaf7f0}.softr{fill:#fff0ed}.softg{fill:#fff7df}.card{fill:#fff;stroke:#d4ddd6;stroke-width:2}.t{font:800 46px Inter,system-ui,sans-serif}.sub{font:500 19px Inter,system-ui,sans-serif}.name{font:800 23px Inter,system-ui,sans-serif}.label{font:800 12px Inter,system-ui,sans-serif;letter-spacing:1.4px}.body{font:600 15px Inter,system-ui,sans-serif}.small{font:550 13px Inter,system-ui,sans-serif}.mono{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.node{fill:#fff;stroke:#268b60;stroke-width:3}.hotnode{fill:#fff7df;stroke:#ce941d;stroke-width:4}.edge{stroke:#819087;stroke-width:2.5}.hot{stroke:#d45545;stroke-width:4;fill:none}.white{fill:#fff}.cell{fill:#fff;stroke:#b8c5bc;stroke-width:2}.wall{fill:#173c2e}.visit{fill:#d7f0e2;stroke:#268b60;stroke-width:2}
  </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#d45545"/></marker></defs>
  <rect class="bg" width="1600" height="1390"/><rect class="head" width="1600" height="146"/>
  <text class="t white" x="70" y="68">TREES &amp; GRAPHS: CHOOSE THE OUTPUT</text>
  <text class="sub" x="70" y="108" fill="#c7dacd">Traversal is the engine. The requested output decides DFS, BFS, topological order, shortest path, or connectivity structure.</text>

  <!-- decision strip -->
  <g transform="translate(60 176)"><rect class="card" width="1480" height="122" rx="10"/>
    <text class="label green" x="22" y="31">ONE-LINE ROUTER</text>
    <text class="body ink" x="22" y="62">Need a path / subtree fact?</text><text class="name green" x="230" y="63">DFS</text>
    <text class="body ink" x="335" y="62">Fewest edges / levels?</text><text class="name green" x="535" y="63">BFS</text>
    <text class="body ink" x="630" y="62">Dependencies?</text><text class="name green" x="754" y="63">TOPO</text>
    <text class="body ink" x="875" y="62">Repeated connectivity?</text><text class="name green" x="1065" y="63">UNION-FIND</text>
    <text class="body ink" x="22" y="98">Weighted shortest?</text><text class="name gold" x="180" y="99">DIJKSTRA</text>
    <text class="body ink" x="335" y="98">Connect all for least cost?</text><text class="name gold" x="555" y="99">MST</text>
    <text class="body ink" x="720" y="98">Tree + sorted property?</text><text class="name gold" x="914" y="99">BST / INORDER</text>
    <text class="body ink" x="1115" y="98">Grid?</text><text class="name red" x="1160" y="99">IT IS A GRAPH</text>
  </g>

  <!-- row 1 -->
  <g transform="translate(60 324)"><rect class="card" width="720" height="300" rx="10"/><rect class="soft" width="720" height="42" rx="10"/>
    <text class="label green" x="22" y="27">SUBTREE / PATH / AGGREGATE</text><text class="name ink" x="22" y="77">TREE DFS: trust the recursive contract</text><text class="body muted" x="22" y="104">Define exactly what dfs(node) returns. Then combine children.</text>
    <g transform="translate(34 115)"><circle class="node" cx="145" cy="24" r="23"/><circle class="node" cx="75" cy="82" r="23"/><circle class="node" cx="215" cy="82" r="23"/><circle class="node" cx="30" cy="140" r="23"/><circle class="node" cx="120" cy="140" r="23"/><line class="edge" x1="128" y1="41" x2="91" y2="65"/><line class="edge" x1="162" y1="41" x2="199" y2="65"/><line class="edge" x1="62" y1="102" x2="43" y2="120"/><line class="edge" x1="88" y1="102" x2="107" y2="120"/><path class="hot" d="M30 166C75 184 120 184 145 51" marker-end="url(#arr)"/><text class="small muted" x="0" y="180">postorder: children answer before parent</text></g>
    <g transform="translate(350 133)"><rect class="softg" width="340" height="135" rx="8"/><text class="label gold" x="16" y="25">CONTRACT EXAMPLES</text><text class="mono ink" x="16" y="52">height(node) → max depth below</text><text class="mono ink" x="16" y="78">balanced(node) → height or FAIL</text><text class="mono ink" x="16" y="104">diameter: update global with L+R</text><text class="small muted" x="16" y="126">Depth · Diameter · LCA · Path Sum</text></g>
  </g>
  <g transform="translate(820 324)"><rect class="card" width="720" height="300" rx="10"/><rect class="soft" width="720" height="42" rx="10"/>
    <text class="label green" x="22" y="27">LEVELS / FEWEST UNWEIGHTED EDGES</text><text class="name ink" x="22" y="77">BFS: the queue is the frontier</text><text class="body muted" x="22" y="104">BFS discovers every node at distance d before distance d+1.</text>
    <g transform="translate(36 115)"><circle class="hotnode" cx="145" cy="24" r="23"/><circle class="node" cx="75" cy="82" r="23"/><circle class="node" cx="215" cy="82" r="23"/><circle class="node" cx="30" cy="140" r="23"/><circle class="node" cx="120" cy="140" r="23"/><circle class="node" cx="260" cy="140" r="23"/><line class="edge" x1="128" y1="41" x2="91" y2="65"/><line class="edge" x1="162" y1="41" x2="199" y2="65"/><line class="edge" x1="62" y1="102" x2="43" y2="120"/><line class="edge" x1="88" y1="102" x2="107" y2="120"/><line class="edge" x1="228" y1="102" x2="247" y2="120"/><path class="hot" d="M330 24H420" marker-end="url(#arr)"/><rect class="softg" x="435" y="0" width="210" height="122" rx="8"/><text class="label gold" x="451" y="25">QUEUE</text><text class="mono ink" x="451" y="50">[root]</text><text class="mono ink" x="451" y="75">[left, right]</text><text class="mono ink" x="451" y="100">[next level ...]</text><text class="small muted" x="330" y="145">Mark visited when enqueued, not when popped.</text><text class="small muted" x="330" y="170">Level Order · Word Ladder · Rotten Oranges</text></g>
  </g>

  <!-- row 2 -->
  <g transform="translate(60 650)"><rect class="card" width="470" height="320" rx="10"/><rect class="soft" width="470" height="42" rx="10"/>
    <text class="label green" x="20" y="27">MATRIX + LOCAL MOVES</text><text class="name ink" x="20" y="76">GRID = IMPLICIT GRAPH</text><text class="body muted" x="20" y="103">Cell is node; allowed move is edge.</text>
    <g transform="translate(30 132)">
      <rect class="visit" width="44" height="44"/><rect class="visit" x="46" width="44" height="44"/><rect class="wall" x="92" width="44" height="44"/><rect class="cell" x="138" width="44" height="44"/><rect class="cell" x="184" width="44" height="44"/>
      <rect class="cell" y="46" width="44" height="44"/><rect class="visit" x="46" y="46" width="44" height="44"/><rect class="wall" x="92" y="46" width="44" height="44"/><rect class="cell" x="138" y="46" width="44" height="44"/><rect class="cell" x="184" y="46" width="44" height="44"/>
      <rect class="cell" y="92" width="44" height="44"/><rect class="visit" x="46" y="92" width="44" height="44"/><rect class="visit" x="92" y="92" width="44" height="44"/><rect class="visit" x="138" y="92" width="44" height="44"/><rect class="cell" x="184" y="92" width="44" height="44"/>
      <text class="label gold" x="260" y="23">STATE</text><text class="small ink" x="260" y="48">visited set or mutate grid</text><text class="label gold" x="260" y="78">MOVE</text><text class="mono ink" x="260" y="103">for dr, dc in dirs</text><text class="small muted" x="0" y="173">Islands · Flood Fill · Pacific Atlantic</text>
    </g>
  </g>
  <g transform="translate(550 650)"><rect class="card" width="470" height="320" rx="10"/><rect class="soft" width="470" height="42" rx="10"/>
    <text class="label green" x="20" y="27">PREREQUISITES / VALID ORDER</text><text class="name ink" x="20" y="76">TOPOLOGICAL SORT</text><text class="body muted" x="20" y="103">A directed cycle means no valid ordering.</text>
    <g transform="translate(36 132)"><circle class="node" cx="30" cy="58" r="23"/><circle class="node" cx="145" cy="25" r="23"/><circle class="node" cx="145" cy="95" r="23"/><circle class="node" cx="260" cy="58" r="23"/><path class="edge" d="M53 53L119 33"/><path class="edge" d="M53 63L119 87"/><path class="edge" d="M168 32L236 52"/><path class="edge" d="M168 88L236 64"/><rect class="softg" x="300" width="110" height="120" rx="8"/><text class="label gold" x="315" y="24">INDEGREE 0</text><text class="mono ink" x="315" y="52">queue [A]</text><text class="small ink" x="315" y="79">pop → remove</text><text class="small ink" x="315" y="99">outgoing edges</text><text class="small muted" x="0" y="165">Course Schedule · Alien Dictionary · Build Order</text></g>
  </g>
  <g transform="translate(1040 650)"><rect class="card" width="500" height="320" rx="10"/><rect class="soft" width="500" height="42" rx="10"/>
    <text class="label green" x="20" y="27">MANY MERGES / CONNECTED QUERIES</text><text class="name ink" x="20" y="76">UNION–FIND</text><text class="body muted" x="20" y="103">Track component representatives, not paths.</text>
    <g transform="translate(36 130)"><circle class="node" cx="50" cy="35" r="23"/><circle class="node" cx="20" cy="105" r="23"/><circle class="node" cx="80" cy="105" r="23"/><circle class="node" cx="190" cy="35" r="23"/><circle class="node" cx="160" cy="105" r="23"/><circle class="node" cx="220" cy="105" r="23"/><line class="edge" x1="42" y1="57" x2="27" y2="83"/><line class="edge" x1="58" y1="57" x2="73" y2="83"/><line class="edge" x1="182" y1="57" x2="167" y2="83"/><line class="edge" x1="198" y1="57" x2="213" y2="83"/><path class="hot" d="M76 35H164" marker-end="url(#arr)"/><text class="small" x="120" y="22" text-anchor="middle" fill="#d45545">union</text><text class="label gold" x="270" y="24">TWO TRICKS</text><text class="small ink" x="270" y="51">path compression</text><text class="small ink" x="270" y="74">union by rank / size</text><text class="small muted" x="270" y="107">~ O(1) amortized</text><text class="small muted" x="0" y="171">Components · Redundant Connection · Accounts</text></g>
  </g>

  <!-- row 3 -->
  <g transform="translate(60 996)"><rect class="card" width="470" height="300" rx="10"/><rect class="softg" width="470" height="42" rx="10"/>
    <text class="label gold" x="20" y="27">NONNEGATIVE EDGE WEIGHTS</text><text class="name ink" x="20" y="76">DIJKSTRA = BFS + MIN-HEAP</text><text class="body muted" x="20" y="103">Always expand the cheapest unfinished path.</text>
    <g transform="translate(32 116)"><circle class="hotnode" cx="30" cy="55" r="23"/><circle class="node" cx="150" cy="20" r="23"/><circle class="node" cx="150" cy="95" r="23"/><circle class="node" cx="280" cy="55" r="23"/><line class="edge" x1="52" y1="48" x2="127" y2="27"/><line class="edge" x1="52" y1="62" x2="127" y2="88"/><line class="edge" x1="173" y1="27" x2="257" y2="48"/><line class="edge" x1="173" y1="88" x2="257" y2="62"/><text class="small ink" x="88" y="28">2</text><text class="small ink" x="88" y="88">7</text><text class="small ink" x="220" y="28">3</text><text class="small ink" x="220" y="91">1</text><text class="mono green" x="0" y="148">heap: (distance, node)</text><text class="small muted" x="0" y="170">Network Delay · Cheapest path</text></g>
  </g>
  <g transform="translate(550 996)"><rect class="card" width="470" height="300" rx="10"/><rect class="softg" width="470" height="42" rx="10"/>
    <text class="label gold" x="20" y="27">CONNECT ALL NODES, MINIMUM TOTAL COST</text><text class="name ink" x="20" y="76">MINIMUM SPANNING TREE</text><text class="body muted" x="20" y="103">Choose edges, not a path from one source.</text>
    <g transform="translate(32 110)"><circle class="node" cx="40" cy="30" r="22"/><circle class="node" cx="180" cy="30" r="22"/><circle class="node" cx="40" cy="125" r="22"/><circle class="node" cx="180" cy="125" r="22"/><line class="hot" x1="62" y1="30" x2="158" y2="30"/><line class="hot" x1="40" y1="52" x2="40" y2="103"/><line class="hot" x1="62" y1="125" x2="158" y2="125"/><line class="edge" x1="180" y1="52" x2="180" y2="103"/><line class="edge" x1="57" y1="46" x2="163" y2="109"/><text class="label gold" x="250" y="25">KRUSKAL</text><text class="small ink" x="250" y="49">sort edges + union-find</text><text class="label gold" x="250" y="83">PRIM</text><text class="small ink" x="250" y="107">grow tree + min-heap</text><text class="small muted" x="0" y="174">Connecting Cities · Min Cost Points</text></g>
  </g>
  <g transform="translate(1040 996)"><rect class="card" width="500" height="300" rx="10"/><rect class="softg" width="500" height="42" rx="10"/>
    <text class="label gold" x="20" y="27">TREE WITH ORDER: LEFT &lt; NODE &lt; RIGHT</text><text class="name ink" x="20" y="76">BST: INORDER REVEALS SORTED ORDER</text><text class="body muted" x="20" y="103">Use bounds when validating; use inorder for kth.</text>
    <g transform="translate(32 116)"><circle class="node" cx="135" cy="22" r="23"/><circle class="node" cx="65" cy="90" r="23"/><circle class="node" cx="205" cy="90" r="23"/><text class="body ink" x="135" y="28" text-anchor="middle">5</text><text class="body ink" x="65" y="96" text-anchor="middle">3</text><text class="body ink" x="205" y="96" text-anchor="middle">8</text><line class="edge" x1="118" y1="39" x2="81" y2="73"/><line class="edge" x1="152" y1="39" x2="189" y2="73"/><path class="hot" d="M40 132H235" marker-end="url(#arr)"/><text class="mono ink" x="53" y="157">3 → 5 → 8</text><rect class="softr" x="285" width="150" height="120" rx="8"/><text class="label red" x="300" y="25">VALIDATE</text><text class="mono ink" x="300" y="52">low &lt; x &lt; high</text><text class="small ink" x="300" y="78">left: high = x</text><text class="small ink" x="300" y="99">right: low = x</text></g>
  </g>
  <text class="sub ink" x="800" y="1350" text-anchor="middle">DFS answers through recursion. BFS answers through distance. Specialized graph patterns answer order, weight, or connectivity.</text>
</svg>
