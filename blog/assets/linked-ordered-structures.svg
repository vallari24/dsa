<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">Linked, nested, and ordered data structure patterns</title>
  <desc id="desc">Visual interview guide for linked lists, stacks, queues, heaps, intervals, tries, and cache design.</desc>
  <defs><style>
    .bg{fill:#f5f8f8}.navy{fill:#173746}.ink{fill:#16252b}.muted{fill:#596970}.blue{fill:#2c88a7}.amber{fill:#d18a16}.softb{fill:#eaf6fa}.softa{fill:#fff6df}.card{fill:#fff;stroke:#d4dee1;stroke-width:2}.t{font:800 45px Inter,system-ui,sans-serif}.sub{font:500 19px Inter,system-ui,sans-serif}.name{font:800 23px Inter,system-ui,sans-serif}.label{font:800 12px Inter,system-ui,sans-serif;letter-spacing:1.4px}.body{font:600 15px Inter,system-ui,sans-serif}.small{font:550 13px Inter,system-ui,sans-serif}.mono{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.node{fill:#fff;stroke:#2c88a7;stroke-width:3}.line{fill:none;stroke:#70838b;stroke-width:2.5}.hot{fill:none;stroke:#d18a16;stroke-width:4}.white{fill:#fff}
  </style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#70838b"/></marker><marker id="hotarr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#d18a16"/></marker></defs>
  <rect class="bg" width="1600" height="1260"/><rect class="navy" width="1600" height="146"/>
  <text class="t white" x="70" y="68">STRUCTURES: CHOOSE BY THE OPERATION</text>
  <text class="sub" x="70" y="108" fill="#c8d9df">The right structure makes the expensive operation cheap: access, resolve, prioritize, merge, or share a prefix.</text>

  <!-- Row 1: linked list trio -->
  <g transform="translate(60 180)"><rect class="card" width="480" height="290" rx="10"/><rect class="softb" width="480" height="42" rx="10"/>
    <text class="label blue" x="22" y="27">POINTER IDENTITY · NOT INDEXES</text><text class="name ink" x="22" y="75">REVERSE A LINKED LIST</text><text class="body muted" x="22" y="102">Need: change arrow direction without losing the rest.</text>
    <g transform="translate(34 132)"><rect class="node" width="62" height="44" rx="7"/><rect class="node" x="118" width="62" height="44" rx="7"/><rect class="node" x="236" width="62" height="44" rx="7"/><text class="body ink" x="31" y="28" text-anchor="middle">1</text><text class="body ink" x="149" y="28" text-anchor="middle">2</text><text class="body ink" x="267" y="28" text-anchor="middle">3</text><path class="line" d="M62 22H112" marker-end="url(#arr)"/><path class="line" d="M180 22H230" marker-end="url(#arr)"/><text class="mono blue" x="0" y="79">next = cur.next</text><text class="mono blue" x="0" y="102">cur.next = prev</text><text class="mono blue" x="0" y="125">prev, cur = cur, next</text></g>
    <text class="label amber" x="310" y="216">INVARIANT</text><text class="small ink" x="310" y="239">prev is already</text><text class="small ink" x="310" y="258">reversed; cur is</text><text class="small ink" x="310" y="277">still untouched.</text>
  </g>
  <g transform="translate(560 180)"><rect class="card" width="480" height="290" rx="10"/><rect class="softb" width="480" height="42" rx="10"/>
    <text class="label blue" x="22" y="27">CYCLE · MIDDLE · KTH FROM END</text><text class="name ink" x="22" y="75">FAST / SLOW POINTERS</text><text class="body muted" x="22" y="102">Different speeds turn distance into a meeting event.</text>
    <g transform="translate(32 130)"><circle class="node" cx="24" cy="28" r="22"/><circle class="node" cx="100" cy="28" r="22"/><circle class="node" cx="176" cy="28" r="22"/><circle class="node" cx="252" cy="28" r="22"/><path class="line" d="M46 28H72" marker-end="url(#arr)"/><path class="line" d="M122 28H148" marker-end="url(#arr)"/><path class="line" d="M198 28H224" marker-end="url(#arr)"/><path class="hot" d="M252 52C252 122 100 122 100 55" marker-end="url(#hotarr)"/><text class="mono blue" x="0" y="100">slow += 1 node</text><text class="mono blue" x="176" y="100">fast += 2 nodes</text></g>
    <rect class="softa" x="22" y="244" width="436" height="28" rx="6"/><text class="small ink" x="34" y="263">Cycle: meet. Middle: fast ends. Gap k: second follows first.</text>
  </g>
  <g transform="translate(1060 180)"><rect class="card" width="480" height="290" rx="10"/><rect class="softb" width="480" height="42" rx="10"/>
    <text class="label blue" x="22" y="27">O(1) LOOKUP + O(1) REORDER</text><text class="name ink" x="22" y="75">HASH MAP + DOUBLY LINKED LIST</text><text class="body muted" x="22" y="102">One structure finds; the other maintains recency.</text>
    <g transform="translate(28 132)"><rect class="softb" width="120" height="110" rx="8"/><text class="label blue" x="14" y="24">MAP</text><text class="mono ink" x="14" y="50">A → node A</text><text class="mono ink" x="14" y="75">B → node B</text><path class="hot" d="M125 54H190" marker-end="url(#hotarr)"/><rect class="node" x="200" y="32" width="56" height="44" rx="7"/><rect class="node" x="292" y="32" width="56" height="44" rx="7"/><rect class="node" x="384" y="32" width="56" height="44" rx="7"/><path class="line" d="M256 54H286M292 65H262M348 54H378M384 65H354" marker-end="url(#arr)"/><text class="small ink" x="228" y="59" text-anchor="middle">MRU</text><text class="small ink" x="412" y="59" text-anchor="middle">LRU</text><text class="small muted" x="200" y="105">LRU Cache · LFU variants</text></g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(60 494)"><rect class="card" width="355" height="310" rx="10"/><rect class="softa" width="355" height="42" rx="10"/>
    <text class="label amber" x="20" y="27">LAST UNRESOLVED FIRST</text><text class="name ink" x="20" y="76">STACK</text><text class="body muted" x="20" y="103">Nested · matching · undo · expression</text>
    <g transform="translate(28 130)"><rect class="node" y="100" width="105" height="38" rx="4"/><rect class="node" y="60" width="105" height="38" rx="4"/><rect class="node" y="20" width="105" height="38" rx="4"/><text class="body ink" x="52" y="45" text-anchor="middle">[</text><text class="body ink" x="52" y="85" text-anchor="middle">(</text><text class="body ink" x="52" y="125" text-anchor="middle">{</text><path class="hot" d="M145 32H118" marker-end="url(#hotarr)"/><text class="small ink" x="155" y="36">next close checks TOP</text><text class="label blue" x="145" y="82">STATE</text><text class="small ink" x="145" y="105">open / unresolved items</text><text class="small muted" x="145" y="132">Parentheses · RPN</text></g>
    <text class="mono blue" x="20" y="291">push → inspect top → pop</text>
  </g>
  <g transform="translate(435 494)"><rect class="card" width="355" height="310" rx="10"/><rect class="softa" width="355" height="42" rx="10"/>
    <text class="label amber" x="20" y="27">FIRST IN FIRST OUT / BOTH ENDS</text><text class="name ink" x="20" y="76">QUEUE / DEQUE</text><text class="body muted" x="20" y="103">Levels · stream · window maximum</text>
    <g transform="translate(28 128)"><path class="hot" d="M0 25H45" marker-end="url(#hotarr)"/><rect class="node" x="55" width="58" height="50" rx="6"/><rect class="node" x="119" width="58" height="50" rx="6"/><rect class="node" x="183" width="58" height="50" rx="6"/><path class="hot" d="M251 25H296" marker-end="url(#hotarr)"/><text class="small muted" x="55" y="78">front</text><text class="small muted" x="204" y="78">back</text><text class="label blue" x="0" y="110">DEQUE INVARIANT</text><text class="small ink" x="0" y="134">max-window values decrease front → back</text></g>
    <text class="small muted" x="20" y="291">BFS · Sliding Window Maximum · 0-1 BFS</text>
  </g>
  <g transform="translate(810 494)"><rect class="card" width="355" height="310" rx="10"/><rect class="softa" width="355" height="42" rx="10"/>
    <text class="label amber" x="20" y="27">REPEATEDLY NEED THE BEST</text><text class="name ink" x="20" y="76">HEAP</text><text class="body muted" x="20" y="103">Top K · kth · merge streams · scheduling</text>
    <g transform="translate(45 116)"><circle class="node" cx="130" cy="22" r="24"/><circle class="node" cx="70" cy="78" r="24"/><circle class="node" cx="190" cy="78" r="24"/><circle class="node" cx="35" cy="132" r="24"/><circle class="node" cx="105" cy="132" r="24"/><line class="line" x1="112" y1="39" x2="86" y2="61"/><line class="line" x1="148" y1="39" x2="174" y2="61"/><line class="line" x1="55" y1="98" x2="45" y2="110"/><line class="line" x1="84" y1="100" x2="94" y2="110"/><text class="body ink" x="130" y="27" text-anchor="middle">1</text><text class="body ink" x="70" y="83" text-anchor="middle">4</text><text class="body ink" x="190" y="83" text-anchor="middle">3</text><text class="body ink" x="35" y="137" text-anchor="middle">9</text><text class="body ink" x="105" y="137" text-anchor="middle">7</text></g>
    <text class="label blue" x="270" y="145">INVARIANT</text><text class="small ink" x="270" y="170">root is best;</text><text class="small ink" x="270" y="190">rest keeps</text><text class="small ink" x="270" y="210">partial order</text><text class="small muted" x="20" y="291">Keep size K → O(n log K)</text>
  </g>
  <g transform="translate(1185 494)"><rect class="card" width="355" height="310" rx="10"/><rect class="softa" width="355" height="42" rx="10"/>
    <text class="label amber" x="20" y="27">RANGES OVERLAP IN TIME / SPACE</text><text class="name ink" x="20" y="76">INTERVAL SWEEP</text><text class="body muted" x="20" y="103">Sort endpoints, then track a frontier.</text>
    <g transform="translate(28 119)"><line class="line" x1="0" y1="20" x2="295" y2="20"/><rect x="12" y="4" width="116" height="32" rx="6" fill="#eaf6fa"/><rect x="78" y="54" width="148" height="32" rx="6" fill="#fff6df"/><rect x="216" y="4" width="62" height="32" rx="6" fill="#eaf6fa"/><path class="hot" d="M12 108H226" marker-end="url(#hotarr)"/><text class="label blue" x="0" y="142">INVARIANT</text><text class="small ink" x="92" y="142">earlier starts are fully handled</text></g>
    <text class="small muted" x="20" y="291">Merge · Insert · Meeting Rooms · Skyline</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(60 828)"><rect class="card" width="720" height="320" rx="10"/><rect class="softb" width="720" height="42" rx="10"/>
    <text class="label blue" x="22" y="27">MANY WORDS SHARE THEIR BEGINNING</text><text class="name ink" x="22" y="77">TRIE: make each prefix a reusable node</text><text class="body muted" x="22" y="104">Use when queries are about prefixes, not just exact membership.</text>
    <g transform="translate(54 112)"><circle class="node" cx="200" cy="20" r="22"/><circle class="node" cx="120" cy="82" r="22"/><circle class="node" cx="280" cy="82" r="22"/><circle class="node" cx="65" cy="150" r="22"/><circle class="node" cx="165" cy="150" r="22"/><circle class="node" cx="280" cy="150" r="22"/><line class="line" x1="183" y1="35" x2="137" y2="67"/><line class="line" x1="217" y1="35" x2="263" y2="67"/><line class="line" x1="105" y1="99" x2="78" y2="132"/><line class="line" x1="135" y1="99" x2="152" y2="132"/><line class="line" x1="280" y1="104" x2="280" y2="128"/><text class="body ink" x="120" y="88" text-anchor="middle">c</text><text class="body ink" x="280" y="88" text-anchor="middle">d</text><text class="body ink" x="65" y="156" text-anchor="middle">a</text><text class="body ink" x="165" y="156" text-anchor="middle">o</text><text class="body ink" x="280" y="156" text-anchor="middle">o</text><text class="small muted" x="25" y="194">cat · car share c-a</text></g>
    <g transform="translate(430 132)"><rect class="softa" width="260" height="126" rx="8"/><text class="label amber" x="16" y="25">STATE</text><text class="small ink" x="16" y="49">children[character]</text><text class="small ink" x="16" y="70">+ end_of_word</text><text class="label amber" x="16" y="96">COST</text><text class="mono ink" x="68" y="96">O(word length)</text><text class="small muted" x="16" y="118">Autocomplete · Word Search II</text></g>
  </g>
  <g transform="translate(820 828)"><rect class="card" width="720" height="320" rx="10"/><rect class="softb" width="720" height="42" rx="10"/>
    <text class="label blue" x="22" y="27">DESIGN QUESTION? START FROM REQUIRED COMPLEXITIES</text><text class="name ink" x="22" y="77">COMPOSE STRUCTURES: each one owns one operation</text>
    <text class="body muted" x="22" y="104">Do not hunt for one magical structure. Map each operation to its owner.</text>
    <g transform="translate(26 132)">
      <rect class="softb" width="204" height="125" rx="8"/><text class="label blue" x="14" y="25">NEED</text><text class="small ink" x="14" y="50">lookup O(1)</text><text class="small ink" x="14" y="74">remove O(1)</text><text class="small ink" x="14" y="98">oldest/newest O(1)</text>
      <path class="hot" d="M216 62H276" marker-end="url(#hotarr)"/>
      <rect class="softa" x="290" width="370" height="125" rx="8"/><text class="label amber" x="304" y="25">OWNERS</text><text class="mono ink" x="304" y="52">lookup     → hash map</text><text class="mono ink" x="304" y="78">order      → doubly linked list</text><text class="mono ink" x="304" y="104">best item  → heap / ordered set</text>
      <text class="small muted" x="0" y="164">Examples: LRU Cache · Time Map · Median Finder · Randomized Set</text>
    </g>
  </g>
  <text class="sub ink" x="800" y="1210" text-anchor="middle">Ask which operation repeats. Choose the structure that makes that operation cheap.</text>
</svg>
